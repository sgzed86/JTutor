name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pytest
      - name: Lint
        run: ruff check backend scripts tests
      - name: Tests (includes golden lesson transcripts)
        run: pytest -q

  frontend:
    name: Frontend (typecheck + lint + tests + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci --prefix apps/desktop
      - name: Typecheck
        run: npm run typecheck --prefix apps/desktop
      - name: Lint
        run: npm run lint --prefix apps/desktop
      - name: Unit tests
        run: npm run test --prefix apps/desktop
      - name: Build
        run: npm run build --prefix apps/desktop
