line-length = 110
target-version = "py311"

[lint]
select = ["E", "F", "W", "B", "I", "UP", "C4", "SIM"]
ignore = [
  "E501",    # long lines are formatted by hand in scripted Japanese strings
  "SIM105",  # contextlib.suppress is not clearer for these one-liners
  "B008",    # FastAPI dependency markers in defaults are idiomatic
  "UP007",   # keep Optional/Union style consistent with the existing code
]

[lint.per-file-ignores]
"scripts/*" = ["E402", "B905", "SIM"]
"tests/*" = ["B011"]
"backend/app/orchestrator.py" = ["SLF001"]
