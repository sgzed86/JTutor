# Real role-plays for Can-do checks (LLM-judged; expected = fallback examples).
- can_do_id: CD_L02_04
  setup_en: "The clerk said the room number too fast. Say you don't understand."
  goal_en: "Learner says they don't understand (わかりません)."
  partner_jp: 部屋は213です。
  expected:
  - "よくわかりません"
  - "わかりません"
  - "わからない"
  hint_en: "The clerk said the room number too fast. Say you don't understand."
- can_do_id: CD_L02_04
  setup_en: "Reception spoke quickly. Say you don't understand well."
  goal_en: "Learner communicates they didn't catch it."
  partner_jp: ここは受付です。在留カードを見せてください。
  expected:
  - "よくわかりません"
  - "わかりません"
  hint_en: "Reception spoke quickly. Say you don't understand well."
- can_do_id: CD_L02_05
  setup_en: You missed the room number. Ask them to say it again.
  goal_en: Learner asks for a repeat (もう一度).
  partner_jp: 部屋は213です。
  expected:
  - "もういちど、お願いします"
  - "もう一度"
  - "お願いします"
  hint_en: You missed the room number. Ask them to say it again.
- can_do_id: CD_L02_05
  setup_en: They spoke too fast. Ask them to speak a little more slowly.
  goal_en: Learner asks them to slow down (ゆっくり).
  partner_jp: 在留カードを見せてください。
  expected:
  - "もう少し、ゆっくり言ってください"
  - "ゆっくり"
  hint_en: They spoke too fast. Ask them to speak a little more slowly.
- can_do_id: CD_L02_06
  setup_en: Yuki says a number. Repeat it.
  goal_en: Learner says the number they heard.
  partner_jp: 数字です。いち。
  expected:
  - "いち"
  - "1"
  - "一"
  hint_en: Yuki says a number. Repeat it.
- can_do_id: CD_L02_06
  setup_en: Yuki says a number. Repeat it.
  goal_en: Learner says the number they heard.
  partner_jp: 数字です。じゅう。
  expected:
  - "じゅう"
  - "10"
  - "十"
  hint_en: Yuki says a number. Repeat it.
- can_do_id: CD_L02_06
  setup_en: Yuki asks you to say a number. Say 「さん」.
  goal_en: Learner produces a number from the lesson.
  partner_jp: 数字を言ってください。さん。
  expected:
  - "さん"
  - "3"
  - "三"
  hint_en: Yuki asks you to say a number. Say 「さん」.
