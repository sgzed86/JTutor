  culture_notes_en: 'What should you do if you don’t understand what someone has said? What should you
    do when you don’t know how to

    say something in Japanese?

    Can ask someone to say something again if you don’t really understand.

    Listen to the dialogs.

    Three people are each talking to a Japanese person but do not understand what the Japanese person
    is saying.

    What expression did each speaker use when they did not understand the Japanese? Match the words given
    in a–c with ア-ウ.

    Moo ichido, onegaishimasu.

    Moo sukoshi, yukkuri itte kudasai.

    Yoku wakarimasen.

    Check the words and listen to the dialogs again.

    留カード residence card ｜ ここ here ｜ 名

    前 name ｜ 部

    屋 room

    zairyuu kaado koko namae heya

    わかりました I understand.

    wakarimashita

    Look at the illustrations and listen to the dialogs again. What do you think a–c mean in (1)?

    Check how to say the numbers.

    いましょう。 Listen and repeat.

    字 Numbers （0 ～ 10）】

    0 ゼロ zero

    1 いち ichi

    2 に'
