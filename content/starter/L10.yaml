english_notes: 'Have you had a job before? What kind of work did you do?

  Can listen to short and simple instructions at work and understand what to do.

  Listen to the dialogs.

  You are receiving instructions from your supervisor at work.

  What are the instructions? Choose from a–i.

  Listen to the recording and fill in the blanks.

  What expressions were used when giving an instruction or requesting a task?

  Focus on the expressions used and listen to the dialogs again.

  Check the words and listen to the dialogs again.

  ボール cardboard ｜ ドライバー screwdriver ｜ ごみ garbage ｜ 窓

  window

  プロジェクタ projector ｜ リモコン remote controller

  Can confirm and ask someone to repeat the important points when you receive instructions at work.

  Listen to the dialogs.

  The people are each at their workplaces and have been asked by their supervisors to do tasks.

  What were they asked to do? Choose from a–d.

  a. b.

  c. d.

  Listen to the dialogs again, paying attention to the amounts and times. Write the numbers in the blanks.

  Check the words and listen to the dialogs again.

  next to ｜ 〜までに by 〜 ｜ あとで later

  もしもし Hello. (on the phone)

  Listen to the recording and fill in the blanks.

  What expression was used when checking important information?

  What expressions did the speakers use when they didn’t understand, and asked for the amount or time
  to be

  repeated?

  Focus on the expressions used and listen to the dialogs again.'
