quiz_scenarios:
# Real role-plays for Can-do checks (LLM-judged; expected = fallback examples).
- can_do_id: CD_L12_47
  setup_en: Invite Yuki to eat yakiniku together.
  goal_en: Learner invites someone (ませんか / 一緒).
  partner_jp: 今週、ひまです。
  expected:
  - "行きませんか"
  - "ませんか"
  - "一緒"
  hint_en: Invite Yuki to eat yakiniku together.
- can_do_id: CD_L12_47
  setup_en: Invite a friend to a festival.
  goal_en: Learner makes an invitation.
  partner_jp: 日曜日にタイフェスティバルがありますよ。
  expected:
  - "行きませんか"
  - "一緒に"
  - "ませんか"
  hint_en: Invite a friend to a festival.
- can_do_id: CD_L12_48
  setup_en: Yuki invites you. Accept.
  goal_en: Learner accepts an invitation.
  partner_jp: 一緒に焼き肉を食べに行きませんか？
  expected:
  - "いいですね"
  - "行きましょう"
  - "はい"
  hint_en: Yuki invites you. Accept.
- can_do_id: CD_L12_48
  setup_en: "Yuki invites you, but you're busy. Decline politely."
  goal_en: Learner declines simply and politely.
  partner_jp: 今度の土曜日、ハイキングに行きませんか？
  expected:
  - "ちょっと"
  - "すみません"
  - "また今度"
  hint_en: "Yuki invites you, but you're busy. Decline politely."
- can_do_id: CD_L12_49
  setup_en: Suggest a day for going out.
  goal_en: Learner suggests a simple plan (day/time).
  partner_jp: いつがいいですか？
  expected:
  - "土曜日"
  - "日曜日"
  - "ましょう"
  - "いいです"
  hint_en: Suggest a day for going out.
- can_do_id: CD_L12_49
  setup_en: "Propose going to see a friend's match."
  goal_en: Learner suggests a plan.
  partner_jp: 金曜の夜、ひまですか？
  expected:
  - "行きましょう"
  - "どうですか"
  - "ませんか"
  hint_en: "Propose going to see a friend's match."
