english_notes: 'What kind of house do you live in at the moment?

  Can listen to simple explanations when being shown around a house and understand the layout.

  Preparation for the words

  Japanese houses 】

  Listen while looking at the illustrations.

  Listen and repeat the words.

  Listen and choose from a–k.

  Listen to the dialog.

  Nakagawa-san is showing Son-san and Thanh-san around

  the company dorm where they are going to live.

  In what order are they shown the rooms inside the dorm? Write down the order in the blanks.

  Check the words and listen to the dialog again.

  food

  ってくだ さい Please come in. （入

  る come in）

  いでください Please take them off. （脱

  ぐ take off）

  話になります I’ll be in your care. (polite expression used when meeting someone who will look after you)

  Listen to the recording and fill in the blanks.

  What expression was used when showing them the rooms?

  What expression was used when talking about the facilities?

  Focus on the expressions used and listen to the dialog again.

  Can ask and check whether a house or room has everything you need.

  Preparation for the words

  具 Household appliances and furniture 】

  i-Fi

  Listen while looking at the illustrations.

  Listen and repeat the words.

  Listen and choose from a–l.'
