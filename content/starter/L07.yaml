quiz_scenarios:
# Real role-plays for Can-do checks (LLM-judged; expected = fallback examples).
- can_do_id: CD_L07_26
  setup_en: Yuki gives a short house tour. Say what rooms you heard.
  goal_en: Learner shows they understood the layout (rooms mentioned).
  partner_jp: 案内します。ここはリビングです。隣はキッチンです。二階に寝室があります。
  expected:
  - "リビング"
  - "キッチン"
  - "寝室"
  - "二階"
  hint_en: Yuki gives a short house tour. Say what rooms you heard.
- can_do_id: CD_L07_26
  setup_en: Yuki describes her apartment. Summarize where the bathroom is.
  goal_en: Learner restates a location from the tour.
  partner_jp: お風呂とトイレは一階です。ベランダもあります。
  expected:
  - "お風呂"
  - "トイレ"
  - "一階"
  - "ベランダ"
  hint_en: Yuki describes her apartment. Summarize where the bathroom is.
- can_do_id: CD_L07_27
  setup_en: Looking at a room. Ask if there is a microwave.
  goal_en: Learner asks whether something is there (ありますか).
  partner_jp: 私の部屋です。どうぞ。
  expected:
  - "ありますか"
  - "電子レンジはありますか"
  - "ありますか"
  hint_en: Looking at a room. Ask if there is a microwave.
- can_do_id: CD_L07_27
  setup_en: Ask if the apartment has a washing machine.
  goal_en: Learner checks for a needed item.
  partner_jp: このアパートはどうですか？
  expected:
  - "洗濯機はありますか"
  - "ありますか"
  hint_en: Ask if the apartment has a washing machine.
- can_do_id: CD_L07_28
  setup_en: Someone asks where you live. Answer simply.
  goal_en: Learner describes where they live.
  partner_jp: どこに住んでいますか？
  expected:
  - "住んでいます"
  - "アパート"
  - "に"
  hint_en: Someone asks where you live. Answer simply.
- can_do_id: CD_L07_28
  setup_en: Describe your place briefly (size/quiet is fine).
  goal_en: Learner gives a simple description of their home.
  partner_jp: おうちはどんなところですか？
  expected:
  - "住んで"
  - "です"
  - "静か"
  - "狭い"
  - "広い"
  hint_en: Describe your place briefly (size/quiet is fine).
english_notes: 'What kind of house do you live in at the moment?

  Can listen to simple explanations when being shown around a house and understand the layout.

  Preparation for the words

  Japanese houses 】

  Listen while looking at the illustrations.

  Listen and repeat the words.

  Listen and choose from a–k.

  Listen to the dialog.

  Nakagawa-san is showing Son-san and Thanh-san around

  the company dorm where they are going to live.

  In what order are they shown the rooms inside the dorm? Write down the order in the blanks.

  Check the words and listen to the dialog again.

  food

  ってくだ さい Please come in. （入

  る come in）

  いでください Please take them off. （脱

  ぐ take off）

  話になります I’ll be in your care. (polite expression used when meeting someone who will look after you)

  Listen to the recording and fill in the blanks.

  What expression was used when showing them the rooms?

  What expression was used when talking about the facilities?

  Focus on the expressions used and listen to the dialog again.

  Can ask and check whether a house or room has everything you need.

  Preparation for the words

  具 Household appliances and furniture 】

  i-Fi

  Listen while looking at the illustrations.

  Listen and repeat the words.

  Listen and choose from a–l.'
