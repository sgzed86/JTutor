quiz_scenarios:
# Real role-plays for Can-do checks (LLM-judged; expected = fallback examples).
- can_do_id: CD_L08_29
  setup_en: At the office. Ask where Yamada-san is.
  goal_en: Learner asks where someone is.
  partner_jp: ちょっと、山田さんを探しています。
  expected:
  - "どこにいますか"
  - "どこですか"
  - "どこ"
  hint_en: At the office. Ask where Yamada-san is.
- can_do_id: CD_L08_29
  setup_en: Ask where the scissors are.
  goal_en: Learner asks where something is.
  partner_jp: はさみ、使いたいんですけど…
  expected:
  - "どこですか"
  - "どこにありますか"
  - "どこ"
  hint_en: Ask where the scissors are.
- can_do_id: CD_L08_30
  setup_en: Yuki asks where Miru is. Answer with a location word.
  goal_en: Learner says where someone/something is.
  partner_jp: ミロさんはどこにいますか？
  expected:
  - "にいます"
  - "食堂にいます"
  - "です"
  - "ここ"
  hint_en: Yuki asks where Miru is. Answer with a location word.
- can_do_id: CD_L08_30
  setup_en: Say where the tape is (on the desk / in the box is fine).
  goal_en: Learner uses a location expression.
  partner_jp: ガムテープはどこですか？
  expected:
  - "の上"
  - "の中"
  - "あそこ"
  - "です"
  hint_en: Say where the tape is (on the desk / in the box is fine).
- can_do_id: CD_L08_31
  setup_en: Yuki explains office rooms. Say which room is for meetings.
  goal_en: Learner shows they understood a simple location explanation.
  partner_jp: ここは会議室です。そこで打ち合わせをします。隣は食堂です。
  expected:
  - "会議室"
  - "食堂"
  - "打ち合わせ"
  hint_en: Yuki explains office rooms. Say which room is for meetings.
- can_do_id: CD_L08_31
  setup_en: Yuki says where Kenji is. Confirm you understood.
  goal_en: Learner confirms understanding of a location.
  partner_jp: ケンジさんは休憩室にいますよ。
  expected:
  - "わかりました"
  - "休憩室"
  - "はい"
  hint_en: Yuki says where Kenji is. Confirm you understood.
english_notes: 'Have you ever worked for a company? What rooms and facilities did your company have?

  Can listen to a simple explanation when being shown around a room at work and understand what room it
  is.

  Preparation for the words

  屋 Company rooms 】

  Listen while looking at the illustrations.

  Listen and repeat the words.

  Listen and choose from a–f.

  Listen to the dialog.

  You are being shown around the rooms at your first workplace.

  Which room is being introduced? Choose from 1 a–f.

  Listen to the dialog again. What do people do in each room? Choose from ア–エ.

  Check the word and listen to the dialog again.

  性 men

  Listen to the recording and fill in the blanks.

  What do you think で means?

  Focus on the expression used and listen to the dialog again.

  Can ask and answer questions about where someone is.

  Listen to the dialogs.

  The people are each looking for someone at work.

  Where are the people in ①–④? Choose from a–e.

  Write “—” if it is not mentioned.

  Check the words and listen to the dialogs again.

  Where are they?

  たぶん probably ｜ 探

  してみます I’ll try to look.

  う used when telling someone information they did not know）

  う used when sharing information with someone）'
