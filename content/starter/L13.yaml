  prompt_en: Life and culture — read the note, then continue.
  culture_notes_en: 'What types of transport do you have in your country? What transport do you use often?

    Can ask whether a train or bus is going to where you want to go and understand the answer.

    Preparation for the words

    Types of transport 】

    Listen while looking at the illustrations.

    Listen and repeat the words.

    Listen and choose from a–f.

    I will take 〜 .

    Listen to the dialogs.

    Five people are each asking where a form of transport is going.

    Is the transport going to the places in ①-⑤? If it is, write 〇, and if it isn’t, write ×.

    Listen to ②–⑤ again. Which bus / track / pier / train do they need? Write the numbers in the blanks.

    Write a check mark next to the correct answer in ⑤.

    Check the words and listen to the dialogs again.

    対側 opposite side ｜ 先

    ahead ｜ 次

    next

    まりません It does not stop there. （止

    まる stop）

    る take）

    Listen to the recording and fill in the blanks.

    What expression was used when checking whether'
  picture_has_image: false
