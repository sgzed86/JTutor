quiz_scenarios:
# Real role-plays for Can-do checks (LLM-judged; expected = fallback examples).
- can_do_id: CD_L13_52
  setup_en: At the station. Ask if this train goes to Higashi-Shinjuku.
  goal_en: Learner asks whether transit goes to their destination.
  partner_jp: 次の電車ですよ。
  expected:
  - "行きますか"
  - "この電車は"
  - "東新宿"
  hint_en: At the station. Ask if this train goes to Higashi-Shinjuku.
- can_do_id: CD_L13_52
  setup_en: Ask if this bus goes to the airport.
  goal_en: Learner asks a destination question.
  partner_jp: バス乗り場です。
  expected:
  - "行きますか"
  - "空港"
  - "このバス"
  hint_en: Ask if this bus goes to the airport.
- can_do_id: CD_L13_53
  setup_en: The announcement was unclear. Ask where you are now.
  goal_en: Learner asks where they are.
  partner_jp: 次は……（アナウンスが聞こえない）
  expected:
  - "ここはどこですか"
  - "どこですか"
  - "次は"
  hint_en: The announcement was unclear. Ask where you are now.
- can_do_id: CD_L13_53
  setup_en: Confirm the next stop.
  goal_en: Learner asks/confirm location on the line.
  partner_jp: まもなく、次の駅です。
  expected:
  - "次は"
  - "どこですか"
  - "ですか"
  hint_en: Confirm the next stop.
- can_do_id: CD_L13_54
  setup_en: Yuki explains the bus. Say which bus goes to the hospital.
  goal_en: Learner shows they understood simple transit info.
  partner_jp: このバスは行きません。市民病院は23番のバスです。
  expected:
  - "23番"
  - "市民病院"
  - "バス"
  hint_en: Yuki explains the bus. Say which bus goes to the hospital.
- can_do_id: CD_L13_54
  setup_en: Yuki says how she gets to work. How long does it take?
  goal_en: Learner restates transit information.
  partner_jp: 家から会社まで電車で一時間半かかります。
  expected:
  - "一時間半"
  - "電車"
  - "かかります"
  hint_en: Yuki says how she gets to work. How long does it take?
english_notes: 'What types of transport do you have in your country? What transport do you use often?

  Can ask whether a train or bus is going to where you want to go and understand the answer.

  Preparation for the words

  Types of transport 】

  Listen while looking at the illustrations.

  Listen and repeat the words.

  Listen and choose from a–f.

  I will take 〜 .

  Listen to the dialogs.

  Five people are each asking where a form of transport is going.

  Is the transport going to the places in ①-⑤? If it is, write 〇, and if it isn’t, write ×.

  Listen to ②–⑤ again. Which bus / track / pier / train do they need? Write the numbers in the blanks.

  Write a check mark next to the correct answer in ⑤.

  Check the words and listen to the dialogs again.

  対側 opposite side ｜ 先

  ahead ｜ 次

  next

  まりません It does not stop there. （止

  まる stop）

  る take）

  Listen to the recording and fill in the blanks.

  What expression was used when checking whether the transport goes to a certain place?

  Focus on the expression used and listen to the dialogs again.

  Check where something is going.

  Listen to the dialogs.

  Shadow the dialogs.

  Practice using the illustrations from 2 .

  Role-play this situation. You are taking transport and checking whether it goes to a certain place.

  Use local transport and place names.'
