    What kind of stores do you often go to?

    Preparation for the words

    段 Prices 】

    Money

    Listen.

    Listen and repeat the words.

    字 Numbers（100 ～10,000） 値

    段 Prices

    Listen.

    Listen and repeat the words.

    Listen and choose from a–h below.

    字 Number

    〜 yen

    字 Number

    〜 yen

    Listen to the dialogs.

    The speakers are shopping in different stores, and are each asking about the price.

    How much are the items? Take note of the prices.

    At a food stall At a vegetable seller’s

    At a flea market At a second-hand store

    Listen to the dialogs again.

    How much is this?

    Can ask store staff the price of something and understand the answer.

    Listen to the dialogs.

    Four people are each shopping at a souvenir store.

    How much are items ①–④? Take note of the prices.'
