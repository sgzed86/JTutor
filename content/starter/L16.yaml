quiz_scenarios:
# Real role-plays for Can-do checks (LLM-judged; expected = fallback examples).
- can_do_id: CD_L16_66
  setup_en: Yuki says a price. How much is it?
  goal_en: Learner shows they understood the price.
  partner_jp: このTシャツは1990円です。
  expected:
  - "1990円"
  - "円"
  - "千円"
  hint_en: Yuki says a price. How much is it?
- can_do_id: CD_L16_66
  setup_en: At checkout. Restate the total you heard.
  goal_en: Learner understands a spoken price.
  partner_jp: お会計、825円になります。
  expected:
  - "825円"
  - "円"
  hint_en: At checkout. Restate the total you heard.
- can_do_id: CD_L16_67
  setup_en: Ask how much this is.
  goal_en: Learner asks the price (いくら).
  partner_jp: そのシャツ、いいですね。
  expected:
  - "いくらですか"
  - "いくら"
  hint_en: Ask how much this is.
- can_do_id: CD_L16_67
  setup_en: Ask the price of that cake.
  goal_en: Learner asks staff for a price.
  partner_jp: ケーキ、いろいろありますよ。
  expected:
  - "いくらですか"
  - "いくら"
  hint_en: Ask the price of that cake.
- can_do_id: CD_L16_68
  setup_en: At the meat counter. Say how much you want (e.g. 200g).
  goal_en: Learner states amount/quantity when shopping.
  partner_jp: いらっしゃいませ。何にしますか？
  expected:
  - "ください"
  - "グラム"
  - "お願いします"
  hint_en: At the meat counter. Say how much you want (e.g. 200g).
- can_do_id: CD_L16_68
  setup_en: Order two cakes.
  goal_en: Learner says a quantity.
  partner_jp: ケーキですね。いくつですか？
  expected:
  - "二つ"
  - "ください"
  - "お願いします"
  hint_en: Order two cakes.
english_notes: 'Can listen to and understand the price of a product.

  What kind of stores do you often go to?

  Preparation for the words

  段 Prices 】

  Money

  Listen.

  Listen and repeat the words.

  字 Numbers（100 ～10,000） 値

  段 Prices

  Listen.

  Listen and repeat the words.

  Listen and choose from a–h below.

  字 Number

  〜 yen

  字 Number

  〜 yen

  Listen to the dialogs.

  The speakers are shopping in different stores, and are each asking about the price.

  How much are the items? Take note of the prices.

  At a food stall At a vegetable seller’s

  At a flea market At a second-hand store

  Listen to the dialogs again.

  How much is this?

  Can ask store staff the price of something and understand the answer.

  Listen to the dialogs.

  Four people are each shopping at a souvenir store.

  How much are items ①–④? Take note of the prices.'
