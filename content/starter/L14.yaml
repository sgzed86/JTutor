english_notes: 'What facilities and places are in your town? What are they like?

  Can ask where the toilets or an ATM, etc., are.

  Listen to the dialogs.

  Six people are each asking someone where something is.

  What places are they asking about? Choose from a–f.

  TM f. 喫

  Listen to the dialogs again. Did the people learn where the places are? Write 〇 if they did, and × if
  they didn’t.

  Check the words and listen to the dialogs again.

  あちら over there ｜ 飲

  drink

  a casual way of saying あちら）

  ビル building ｜ 奥

  inside

  an informal way of saying すみません）

  Listen to the recording and fill in the blanks.

  What expressions were used when asking about a place?

  Focus on the expressions used and listen to the dialogs again.

  Ask where something is.

  Listen to the dialogs.

  Shadow the dialogs.

  Practice using the illustrations from 1 (2).

  Ask about places inside the building you are in, such as the facilities.'
