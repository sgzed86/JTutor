grammar:
- point: N です
  pattern_en: Name + です
  prompt_jp: 名前を いってください。れい：トンです。
  prompt_en: Say a name with です — like the worksheet example.
  worksheet_pages:
  - 2
  examples:
  - jp: トンです
    en: I'm Ton.
  - jp: パクです
    en: I'm Pak.
  - jp: 私はマルシアです
    en: I'm Marcia.
- point: 【place】から来ました
  pattern_en: Country + から来ました
  prompt_jp: どこから きましたか。れい：タイから来ました。
  prompt_en: Say where someone is from using から来ました.
  worksheet_pages:
  - 2
  examples:
  - jp: タイから来ました
    en: I came from Thailand.
  - jp: ブラジルから来ました
    en: I came from Brazil.
  - jp: ミャンマーから来ました
    en: I came from Myanmar.
  - jp: 韓国から来ました
    en: I came from Korea.
- point: お名前は？
  pattern_en: Ask someone's name
  prompt_jp: 名前を きいてください。お名前は？
  prompt_en: Ask someone's name.
  worksheet_pages:
  - 3
  examples:
  - jp: お名前は？
    en: What's your name?
  - jp: お名前は
    en: What's your name?
- point: ご出身は？
  pattern_en: Ask where someone is from
  prompt_jp: 出身を きいてください。ご出身は？
  prompt_en: Ask where they are from.
  worksheet_pages:
  - 3
  examples:
  - jp: ご出身は？
    en: Where are you from?
  - jp: ご出身は
    en: Where are you from?
- point: S か？
  pattern_en: Yes/no question with か
  prompt_jp: か をつけて しつもんに してください。れい：タイからですか。
  prompt_en: Make a yes/no question with か — say one of the lines below.
  worksheet_pages:
  - 3
  examples:
  - jp: タイからですか
    en: Are you from Thailand?
  - jp: 友だちですか
    en: Are you friends?
  - jp: トンさんですか
    en: Are you Ton?
- point: N も
  pattern_en: も = also / too
  prompt_jp: も をつかって いってください。
  prompt_en: Use も (also). Say that Kemara is also from Vietnam — or that you are too.
  worksheet_pages:
  - 4
  examples:
  - jp: ケマラさんも、ベトナムからですか
    en: Is Kemara also from Vietnam?
  - jp: 私もベトナムです
    en: I'm also from Vietnam.
- point: N じゃないです
  pattern_en: じゃないです = is not
  prompt_jp: ちがうとき いってください。れい：ベトナムじゃないです。
  prompt_en: Say that something is NOT true with じゃないです.
  worksheet_pages:
  - 4
  examples:
  - jp: ベトナムじゃないです
    en: I'm not from Vietnam.
  - jp: タイじゃないです
    en: I'm not from Thailand.
