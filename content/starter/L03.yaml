quiz_scenarios:
# Real role-plays for Can-do checks (LLM-judged; expected = fallback examples).
- can_do_id: CD_L03_07
  setup_en: "First meeting. Introduce yourself (name and where you're from)."
  goal_en: Learner gives a simple self-intro with name and country/hometown.
  partner_jp: はじめまして。自己紹介をお願いします。
  expected:
  - "です"
  - "から来ました"
  - "はじめまして"
  - "よろしくお願いします"
  hint_en: "First meeting. Introduce yourself (name and where you're from)."
- can_do_id: CD_L03_07
  setup_en: Yuki introduces herself. Give your own short introduction.
  goal_en: "Learner replies with their own intro, not copying hers word-for-word only."
  partner_jp: はじめまして。ユキです。日本から来ました。
  expected:
  - "です"
  - "から来ました"
  - "よろしくお願いします"
  hint_en: Yuki introduces herself. Give your own short introduction.
- can_do_id: CD_L03_08
  setup_en: You meet someone new. Ask their name and where they are from.
  goal_en: Learner asks name and/or hometown (お名前 / どこ).
  partner_jp: はじめまして。どうぞよろしくお願いします。
  expected:
  - "お名前は"
  - "お名前"
  - "どこから"
  - "どちらから"
  hint_en: You meet someone new. Ask their name and where they are from.
- can_do_id: CD_L03_08
  setup_en: Yuki says hello. Ask where she is from.
  goal_en: Learner asks about origin/hometown.
  partner_jp: こんにちは。ユキです。
  expected:
  - "どこから来ましたか"
  - "どちらから"
  - "どこ"
  hint_en: Yuki says hello. Ask where she is from.
- can_do_id: CD_L03_09
  setup_en: First meeting. Use a set phrase like よろしくお願いします.
  goal_en: Learner uses a first-meeting set phrase.
  partner_jp: はじめまして。トンです。タイから来ました。
  expected:
  - "よろしく"
  - "よろしくお願いします"
  - "はじめまして"
  hint_en: First meeting. Use a set phrase like よろしくお願いします.
- can_do_id: CD_L03_09
  setup_en: End a short first meeting politely.
  goal_en: Learner closes with よろしく / similar.
  partner_jp: 今日はありがとうございました。
  expected:
  - "よろしく"
  - "また"
  - "失礼します"
  hint_en: End a short first meeting politely.
english_notes: 'What do you say when you are introducing yourself to someone you are meeting for the first
  time?

  Can give a simple self-introduction, for example by saying your name and country / hometown.

  Listen to the dialog.

  Four people are joining a local Japanese class and introducing themselves.

  Choose the names and nationalities (countries) of the people ①–④ from below.

  前 Name

  Country

  Check the words and listen to the dialog again.

  る come）｜ 私

  I / myself

  はじめまして Hello. (said when meeting someone for the first time)

  いします Nice to meet you.

  Listen to the recording and fill in the blanks.

  What expression was used when the speakers said their names?

  What expression was used when the speakers said their countries / hometowns?

  Focus on the expressions used and listen to the dialog again.

  Introduce yourself.

  Listen to the dialog.

  Shadow the dialog.

  Talk as if you are introducing yourself at work or in a Japanese class.

  First words

  Final words

  Name

  Country / hometown

  Write your name and country.

  You are going to attend an international exchange party. At the party reception, you have been told
  to write your name and country on a

  name tag.

  入例 example）

  Look at the filled-in example above. Which country does the person come from? What is his name?

  Write your country and your name, just like the example.

  Can write your name and country on a name tag, etc.'
