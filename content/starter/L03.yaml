english_notes: 'What do you say when you are introducing yourself to someone you are meeting for the first
  time?

  Can give a simple self-introduction, for example by saying your name and country / hometown.

  Listen to the dialog.

  Four people are joining a local Japanese class and introducing themselves.

  Choose the names and nationalities (countries) of the people ①–④ from below.

  前 Name

  Country

  Check the words and listen to the dialog again.

  る come）｜ 私

  I / myself

  はじめまして Hello. (said when meeting someone for the first time)

  いします Nice to meet you.

  Listen to the recording and fill in the blanks.

  What expression was used when the speakers said their names?

  What expression was used when the speakers said their countries / hometowns?

  Focus on the expressions used and listen to the dialog again.

  Introduce yourself.

  Listen to the dialog.

  Shadow the dialog.

  Talk as if you are introducing yourself at work or in a Japanese class.

  First words

  Final words

  Name

  Country / hometown

  Write your name and country.

  You are going to attend an international exchange party. At the party reception, you have been told
  to write your name and country on a

  name tag.

  入例 example）

  Look at the filled-in example above. Which country does the person come from? What is his name?

  Write your country and your name, just like the example.

  Can write your name and country on a name tag, etc.'
unlock_requires_mastery: true
