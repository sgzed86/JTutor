quiz_scenarios:
- can_do_id: CD_L01_01
  partner_jp: おはよう！
  expected:
  - おはよう
  - おはようございます
  hint_en: A coworker greets you in the morning. Greet them back.
- can_do_id: CD_L01_01
  partner_jp: こんにちは。
  expected:
  - こんにちは
  hint_en: Someone says hello in the afternoon. Reply with a greeting.
- can_do_id: CD_L01_01
  partner_jp: こんばんは。
  expected:
  - こんばんは
  hint_en: Evening greeting — respond in kind.
- can_do_id: CD_L01_02
  partner_jp: じゃあ、また。
  expected:
  - じゃあ、また
  - じゃあまた
  hint_en: Your classmate is leaving. Say goodbye the same way.
- can_do_id: CD_L01_02
  partner_jp: お先に失礼します。
  expected:
  - お先に失礼します
  - 失礼します
  hint_en: A senior colleague is leaving the office. Reply appropriately.
- can_do_id: CD_L01_02
  partner_jp: お疲れさまでした。
  expected:
  - お疲れさまでした
  - お疲れ
  hint_en: Work is over for the day. Reply to their closing phrase.
- can_do_id: CD_L01_03
  partner_jp: どうぞ。
  expected:
  - ありがとう
  - ありがとうございます
  - どうも
  hint_en: Someone offers you something. Thank them.
- can_do_id: CD_L01_03
  partner_jp: あ、すみません！
  expected:
  - すみません
  - ごめん
  hint_en: You bumped into someone. Apologize.
