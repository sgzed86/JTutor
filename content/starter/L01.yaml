lesson_id: L01
lesson: 1
title_en: Good morning!
title_jp: おはようございます
topic_en: Starting to Speak Japanese
pdf_pages:
- 44
- 61
intro_questions:
- jp: あなたの 国では、会ったとき、何と いいますか？
  en: In your language, what do you say when you meet someone?
- jp: 朝と 夜で、あいさつは ちがいますか？
  en: Do your greetings change between morning and evening?
can_dos:
- id: CD_L01_01
  can_do_number: 1
  statement_en: Can exchange greetings when you meet someone.
  statement_jp: 人に会ったとき、あいさつをすることができる。
  activity_hint: '1'
  rubric:
    must_include:
    - おはよう
    - こんにちは
    min_score: 80
- id: CD_L01_02
  can_do_number: 2
  statement_en: Can exchange greetings when parting from someone.
  statement_jp: 人と別れるとき、あいさつをすることができる。
  activity_hint: ''
  rubric:
    must_include:
    - じゃあ
    - 失礼
    - お疲れ
    min_score: 80
- id: CD_L01_03
  can_do_number: 3
  statement_en: Can thank someone or apologize.
  statement_jp: 人にお礼を言ったり、謝ったりすることができる。
  activity_hint: ''
  rubric:
    must_include:
    - ありがとう
    - すみません
    min_score: 80
