english_notes: 'What is it like where you live?

  Can talk in simple terms about your impressions of your town.

  Preparation for the words

  Listen while looking at the illustrations.

  Listen and repeat the words.

  Listen and choose from a-k.

  Listen to the dialogs.

  The four people are talking about the town they each live in now.

  What is the town like? Choose from a-k of 1 .

  Check the words and listen to the dialogs again.

  かに certainly ｜ 住

  みやすい comfortable ｜ 店

  store / restaurant

  Listen to the recording and fill in the blanks.

  What expression was used to connect the adjectives?

  Focus on the expressions used and listen to the dialogs again.

  Talk about the town you live in.

  Listen to the dialogs.

  Shadow the dialogs.

  Practice using the words from 1 .

  Freely talk about the town you live in.'
unlock_requires_mastery: true
