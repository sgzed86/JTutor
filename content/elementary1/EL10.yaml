english_notes: 'Have you ever taken any lessons before? What type of lessons did you take?

  Read the following flyer for information about the lessons.

  You are reading a flyer for information about the lessons offered at a local community center.

  What lessons do ①-④ mention?

  Can find and understand information such as the place, date, and time of lessons offered at a local
  community center, etc.

  Mark where you see the following topics.

  月 every month ｜ 第

  3 the third （第

  ～ the first, the second, etc.）｜ 費

  用 cost ｜ 問

  わせ inquiry

  民館 local community center

  道 Japanese calligraphy ｜ 日

  時 date and time ｜ テ キスト代

  textbook fee （～代

  ～ fee）

  け for non-Japanese residents ｜ 体

  験教室 trial lesson

  気道 aikido

  Which lesson are you interested in?

  Can ask questions about the lesson you are interested in at a local government office and understand
  the answers.

  Listen to the dialogs.

  The four people who saw lesson information are each asking the person in

  charge about the lesson they are interested in.

  What are the people talking about? Put a check mark where appropriate.

  Listen to the dialogs again. Take notes related to the topics that you checked in (1).

  Check the words and listen to the dialogs again.

  要（な） necessary ｜ 最

