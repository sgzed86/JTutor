english_notes: 'How do you spend your days off?

  Can talk in simple terms about your hobbies and favorite things to do.

  Preparation for the words

  Listen while looking at the illustrations.

  Listen and repeat the words.

  Listen and choose from a-l.

  Listen to the dialogs.

  The seven people are each talking about their hobbies.

  What are their hobbies and favorite things to do? Choose from a-l of 1 .

  Check the words and listen to the dialogs again.

  す talk ｜ 特

  にない nothing in particular

  Listen to the recording and fill in the blanks.

  What form of verb was used before ?

  Focus on the expressions used and listen to the dialogs again.

  Talk about your hobbies and favorite things to do.

  Listen to the dialogs.

  Shadow the dialogs.

  Practice using the words from 1 .

  Talk about yourself.

  Can ask and answer questions about how you spend your days off.

  Listen to the dialog.

  Eco-san, Huong-san, and Ishikawa-san are talking during a break at

  work about how they each spend their days off.

  First, listen to the dialog without looking at the script.How do the three people
  each spend their days off? Choose from a-c.

  a. b. c.

  Listen to the dialog again. This time, follow along with the script. What do they
  each do? Where and with whom? Also, what do the

  three people like to do?'
unlock_requires_mastery: true
