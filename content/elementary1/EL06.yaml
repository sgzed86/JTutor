english_notes: 'Have you asked someone for directions or been asked for directions?

  Can ask and understand directions.

  Preparation for the words

  Listen while looking at the illustrations.

  Listen and repeat the words.

  Listen and choose from a-f.

  Listen while looking at the illustrations.

  Listen and repeat the words.

  Listen and choose from a-h.

  f. 1

  h. 3

  g. 2

  Listen to the dialogs.

  Each person does not know how to get to their destination and is asking someone
  for directions.

  Where are ①-④ located? Choose from a - d on the map.

  Check the words and listen to the dialogs again.

  ずっと without turning ｜ 市

  立 municipal ｜ すぐ just ｜ 曲

  がったところ after turning

  a

  b

  c

  d

  Listen to the recording and fill in the blanks.

  What expression was used to ask for directions?

  What expression was used to give directions?

  What expression was used to correct the other person?

  Focus on the expressions used and listen to the dialogs again.'
unlock_requires_mastery: true
