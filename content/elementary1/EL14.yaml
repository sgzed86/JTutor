  culture_notes_en: 'For what reason do you take time off from work?

    Can call your workplace to say that you will be late or take the day off.

    Listen to the dialogs.

    The four people are each calling their workplaces to say that they will be late or take the day off.

    Why did each person call their workplace? Write A if the person will be late and write B if the person
    is taking a day off.

    Listen to the dialogs again. What is the reason? Choose from a-f.

    Check the words and listen to the dialogs again.

    くなる be late ｜ みなさん everyone ｜ 伝

    刻する be late

    あとで later

    ありません I am sorry.

    Listen to the recording and fill in the blanks.

    What expression was used to give a reason?

    What expression was used to apologize?

    Focus on the expressions used and listen to the dialogs again.

    Call to say that you will be late or take the day off.

    Listen to the dialogs.

    Shadow the dialogs.

    Practice using the words from 1 .

    Role-play this sit'
