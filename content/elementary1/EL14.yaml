quiz_scenarios:
# Real role-plays for Can-do checks (LLM-judged; expected = fallback examples).
- can_do_id: CD_EL14_48
  setup_en: "Call work to say you'll be late."
  goal_en: Learner phones in late/absent.
  partner_jp: はい、〇〇商店です。
  expected:
  - "遅れます"
  - "休みます"
  - "すみません"
  hint_en: "Call work to say you'll be late."
- can_do_id: CD_EL14_48
  setup_en: "Call to take the day off (you're sick)."
  goal_en: Learner makes an absence call.
  partner_jp: もしもし、人事です。
  expected:
  - "休みます"
  - "具合が悪い"
  - "すみません"
  hint_en: "Call to take the day off (you're sick)."
- can_do_id: CD_EL14_49
  setup_en: Ask a coworker if you can step out briefly.
  goal_en: Learner asks permission to leave briefly.
  partner_jp: いま、忙しい？
  expected:
  - "いいですか"
  - "ちょっと"
  - "行ってきます"
  hint_en: Ask a coworker if you can step out briefly.
- can_do_id: CD_EL14_49
  setup_en: Ask permission to go to the bathroom/convenience store.
  goal_en: Learner requests brief leave permission.
  partner_jp: 何か用？
  expected:
  - "いいですか"
  - "コンビニ"
  - "トイレ"
  hint_en: Ask permission to go to the bathroom/convenience store.
- can_do_id: CD_EL14_50
  setup_en: Ask in advance for a day off next week.
  goal_en: Learner asks permission for planned leave.
  partner_jp: 来週のシフト、確認したいことがありますか？
  expected:
  - "休みたい"
  - "いいですか"
  - "お願いします"
  hint_en: Ask in advance for a day off next week.
- can_do_id: CD_EL14_50
  setup_en: Request Friday off.
  goal_en: Learner requests advance time off.
  partner_jp: 何か相談ですか？
  expected:
  - "金曜日"
  - "休み"
  - "いいですか"
  hint_en: Request Friday off.
- can_do_id: CD_EL14_51
  setup_en: Ask how to fill out a vacation form.
  goal_en: Learner asks how to complete a leave form.
  partner_jp: 休暇届ですね。
  expected:
  - "書き方"
  - "どこに"
  - "教えて"
  - "ですか"
  hint_en: Ask how to fill out a vacation form.
- can_do_id: CD_EL14_51
  setup_en: Yuki explains the form. What do you write in the reason box?
  goal_en: Learner understands form instructions.
  partner_jp: 理由欄に『私用』と書いて、日付を入れて提出してください。
  expected:
  - "私用"
  - "日付"
  - "提出"
  hint_en: Yuki explains the form. What do you write in the reason box?
english_notes: 'For what reason do you take time off from work?

  Can call your workplace to say that you will be late or take the day off.

  Listen to the dialogs.

  The four people are each calling their workplaces to say that they will be late or take the day off.

  Why did each person call their workplace? Write A if the person will be late and write B if the person
  is taking a day off.

  Listen to the dialogs again. What is the reason? Choose from a-f.

  Check the words and listen to the dialogs again.

  くなる be late ｜ みなさん everyone ｜ 伝

  刻する be late

  あとで later

  ありません I am sorry.

  Listen to the recording and fill in the blanks.

  What expression was used to give a reason?

  What expression was used to apologize?

  Focus on the expressions used and listen to the dialogs again.

  Call to say that you will be late or take the day off.

  Listen to the dialogs.

  Shadow the dialogs.

  Practice using the words from 1 .

  Role-play this situation. One person thinks about the reason for being late or taking the day off and
  calls their work. The other person

  answers the call. If you do not know what to say in Japanese, try to look it up.'
