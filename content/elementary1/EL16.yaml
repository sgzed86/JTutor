  culture_notes_en: 'Is there anything you do daily for your health? What kind of things are you mindful
    of?

    Can give advice when someone is feeling unwell, or listen to and understand the advice.

    Listen while looking at the illustrations.

    Listen and repeat the words.

    Listen and choose from a-p.

    Preparation for the words

    Listen to the dialogs.

    The four people are feeling unwell and are listening to advice from someone.

    What are their health problems? Choose from a-f.

    Listen to the dialogs again. What was the advice? Choose from ア-カ.

    Check the words and listen to the dialogs again.

    近 recently ｜ ぬるい warm ｜ 試

    す try ｜ けっこう quite

    それはいけませんね That is not good. ｜ どうしていますか？ How do you deal with it?

    Listen to the recording and fill in the blanks.

    What was said to the person who looks unwell?

    What expression was used to give advice?

    What is the difference between 飲

    Focus on the expressions used and listen to the dialogs'
