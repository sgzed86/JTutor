english_notes: 'What are the seasons like in your country?

  Can watch a short video about the four seasons in Japan and understand seasonal
  characteristics.

  Preparation for the words

  Listen while looking at the illustrations.

  Listen and repeat the words.

  Listen and choose from a-j.

  Listen to the recording.

  You are watching a video that introduces Japan.

  Choose the characteristics of each season in Japan from a-j of 1 .

  Check the words and listen to the narration again.

  たくさん many / much ｜ 学

  校 school

  Listen to the recording and fill in the blanks.

  What expression was used to describe the changes?

  Focus on the expressions used and listen to the narration again.

  Can talk in simple terms about the seasonal characteristics of your own country.

  Listen to the dialogs.

  The four people are each talking about the seasons and climate of their countries.

  What is the season of each country? Choose from a-d.

  a. b. c. d.

  Listen to the dialogs again.What are the seasonal characteristics of each person’s
  country? Choose from ア-キ.

  Check the words and listen to the dialogs again.

  じ same ｜ 40 度

  40 degrees （～度

  ～ degree(s)）｜ マイナス minus ｜ 短

  い short'
unlock_requires_mastery: true
