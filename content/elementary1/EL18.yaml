- id: CULTURE
  kind: culture
  book_activity: 15
  label: seikatsu_bunka
  audio: []
  key_phrases: []
  book_mode: culture_read
  prompt_en: Life and culture — read the note, then continue.
  culture_notes_en: 'When do you give gifts to someone?

    Can say congratulations for a birthday, wedding, etc.

    Listen to the dialogs.

    The four people are each being congratulated.

    What is the occasion? Choose from a-d.

    Listen to the dialogs again and answer the questions.

    Is the baby a boy or a girl? What is the name?

    What is the person’s spouse like?

    Did the woman receive a birthday gift?

    What will the man receive from the woman?

    Check the words and listen to the dialogs again.

    boy ｜ 女

    girl ｜ 決

    める decide ｜ 考

    える think ｜ 私

    手 spouse ｜ お祝

    い gift ｜ ごちそうする treat a meal ｜ きっと surely ｜ あげる give

    しみですね That sounds exciting. ｜ お幸

    せに Wish you all the happiness.

    Listen to the recording and fill in the blanks.

    J

    LPT 、合

    What do you think is the meaning of そうです?

    What expression was used to congratulate someone?

    Focus on the expressions used and listen to the dialogs again.

    Say words of congratulations.

    Listen to the dialogs'
  picture_has_image: false
