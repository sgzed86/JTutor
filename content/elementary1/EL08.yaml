  culture_notes_en: 'What kind of places do you ask your friend to accompany you to?

    Can ask someone out to eat, go shopping, or go to an event while asking about their experience and
    interest.

    Listen to the dialogs.

    The six people are each inviting an acquaintance somewhere.

    Where did they invite their acquaintance to go? Choose from a-h.

    What was the answer by the person invited? Write 〇 if the person agrees, and Write × if the person
    does not agree.

    Check the words and listen to the dialogs again.

    りない not enough

    理（な） impossible

    Listen to the recording and fill in the blanks.

    What expression was used to ask about the person’s experience?

    What expression was used to invite someone?

    Focus on the expressions used and listen to the dialogs again.

    Invite a person who is new to town.

    Listen to the dialogs.

    Shadow the dialogs.

    Role-play this situation. There is a person who is new to your town. Invite the person'
