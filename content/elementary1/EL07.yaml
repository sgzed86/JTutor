    Can talk about and decide the time and place to meet.

    Listen to the dialog.

    Viet-san, Li-san, and Sato-san are co-workers. They are going out for dinner on their day off.

    First, listen to the dialog without looking at the script. What time and where did they decide to
    meet?

    Listen to the dialog again. This time, follow along with the script.

