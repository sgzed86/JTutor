english_notes: 'What kind of places do you meet with people? Do you arrive right on
  time at the time you promised?

  Can ask and understand the time and place to meet.

  Listen to the dialogs.

  The four people are each asking questions about the time and place to meet.

  What time are they going? Take notes.

  Listen to the dialogs again. Where are they going? Choose from a-d.

  Check the words and listen to the dialogs again.

  合（する） assemble ｜ では so ｜ 案

  内する show / guide ｜ 待

  わせ meet with

  まる start ｜ ス タッフ staff ｜ 3

  0 分前 30 minutes before （～前

  ～before）

  Can talk about and decide the time and place to meet.

  Listen to the dialog.

  Viet-san, Li-san, and Sato-san are co-workers. They are going out for dinner on
  their day off.

  First, listen to the dialog without looking at the script. What time and where did
  they decide to meet?

  Listen to the dialog again. This time, follow along with the script.

  和 peace ｜ 鳥

  bird ｜ 像

  statue

  現This expression is used to ask

  again what the other person

  said if you do not understand

  what they mean.

  Listen to the recording and fill in the blanks.

  What expression was used to suggest a time and place to meet?

  What expression was used to make another suggestion?

  Focus on the expressions used and listen to the dialog again.'
unlock_requires_mastery: true
